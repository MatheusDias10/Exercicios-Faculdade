<!DOCTYPE html>
<html lang='pt-br'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='AulaUm.css '>
</head>
<body>
    <header>
        <!-- Criação de uma barra de navegação.-->
        <nav>
            <!-- Criação de lista não ordenada.-->
            <ul id="Listas">
            <!-- Criando as linhas da lista.-->    
                <li><a href="#">Home</a></li>
                <li><a href="#"></a>Produtos</li>
                <li>Sobre</li>
                <li>Login</li>
            </ul>
        </nav>
    </header>
    <main id="inicio">
        <!-- Título principal (USAR APENAS 1 DESSE POR PÁGINA)-->
        <h1>Blog Web</h1>
        <p>Um site simples feito com carinho</p>

        <a href="https://www.sp.senac.br/group/meu-senac">Senac Site</a>
        <a href="#Listas">Clique aqui!</a>

        <section>
            <!--Section é tag semântica que serve como uma seção do site, como uma área que você pode adicionar DIVs, etc.-->
        </section>

        <article>
            <!--Article é uma tag semântiga independente, ou seja, a mesma serve principalmente isolada e serve como um frame único e individual,
            como uma notícia, comentário, etc.-->
        </article>
    </main>
    <footer>
        <!--Footer é uma tag semântica de fechamento do site, o rodapé.-->
    </footer>
</body>
</html>

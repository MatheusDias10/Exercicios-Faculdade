<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Styles3.css">
    <title>Formulário</title>
</head>
<body>
    <h1>Cadastre-se</h1>
    <p>Formulário destinado ao cadastro de novos doadores.</p>
    <form action="">
        <label for="Nome">Nome</label><br>
        <input type="text" id="Nome" name="nome" placeholder="Digite seu nome"><br>

        <label for="Idade">Idade</label><br>
        <input type="number" id="Idade" name="idade" placeholder="Digite sua idade"
        min="18" max="40"><br>

        <label for="email">E-mail</label><br>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail"><br>

        <label for="senha">Senha</label><br>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha"><br>

        <p>Escolha teu jogo favorito</p>
        <input type="checkbox" id="questionario" name="questionario" placeholder="">Vavazin<br>
        <input type="checkbox" id="questionario" name="questionario" placeholder="">Cs:Go 2<br>
        <input type="checkbox" id="questionario" name="questionario" placeholder="">League of legends<br>
        <input type="checkbox" id="questionario" name="questionario" placeholder="">Fortnite<br>

        <p>Qual seu tipo de musica favorito</p>
        <input type="radio" id="quest2" name="quest2" group="musica">Trap
        <input type="radio" id="quest2" name="quest2" placeholder="musica">Rap
        <input type="radio" id="quest2" name="quest2" placeholder="musica">Funk
        <input type="radio" id="quest2" name="quest2" placeholder="musica">Sertanejo
        <input type="radio" id="quest2" name="quest2" placeholder="musica">Forró<br>

        <input type="button" value="Entrar">
        <input type="button" value="Sair">
        <input type="button" value="Apagar">


        


    </form>
</body>
</html>
